  <div class="flex items-center gap-2">
    <button type="button" onclick="zoomOut()" class="w-9 h-9 rounded-full bg-surface-container border border-gold/40 text-gold flex items-center justify-center hover:bg-gold/20 transition-all" title="Perkecil">

    <button type="button" onclick="resetZoom()" class="w-9 h-9 rounded-full bg-surface-container border border-gold/40 text-gold flex items-center justify-center hover:bg-gold/20 transition-all" title="Reset Zoom">

    <a href="../skema-foto-terbaru.pdf" download="Skema_Foto_Safari_MQ12_15_Agustus_2026.pdf" class="w-9 h-9 rounded-full bg-secondary text-surface-container-lowest flex items-center justify-center hover:bg-secondary/90 transition-all" title="Unduh PDF">
      <span class="material-symbols-outlined text-[18px]">download</span>

<!-- Full-Width Comic Reader Scrollable Container -->

  <div id="pdf-status-msg" class="p-8 text-center text-xs text-on-surface-variant space-y-2">

<!-- Embedded Fallback Container (Displayed if JS or PDF.js is restricted) -->
<section id="pdf-fallback-container" class="w-full hidden">
  <object data="../skema-foto-terbaru.pdf#toolbar=1" type="application/pdf" class="w-full h-[80vh] rounded-2xl border border-gold/40 shadow-2xl">

      </div>

  </object>

<script>
  let pdfDoc = null;
  let currentScale = 1.15;
  const container = document.getElementById('comic-reader-container');
  const zoomBadge = document.getElementById('zoom-level-badge');
  const statusMsg = document.getElementById('pdf-status-msg');
  const fallbackBox = document.getElementById('pdf-fallback-container');

  if (window['pdfjs-dist/build/pdf']) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  async function renderComicView() {
    if (!pdfDoc) return;
    zoomBadge.innerText = Math.round(currentScale * 100) + '%';
    container.innerHTML = '';

    for (let num = 1; num <= pdfDoc.numPages; num++) {
      try {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: currentScale });

        const card = document.createElement('div');
        card.className = 'w-full pdf-canvas-card rounded-xl overflow-hidden bg-white mb-4 relative transition-transform duration-150 flex flex-col items-center';

        const pageBadge = document.createElement('div');
        pageBadge.className = 'absolute top-2 right-2 z-10 px-2.5 py-1 rounded-full bg-black/70 text-gold text-[10px] font-bold border border-gold/30 pointer-events-none';
        pageBadge.innerText = 'Halaman ' + num + ' / ' + pdfDoc.numPages;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.maxWidth = '100%';
        canvas.style.height = 'auto';

        card.appendChild(pageBadge);
        card.appendChild(canvas);
        container.appendChild(card);

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;
      } catch (err) {
        console.error('Error rendering PDF page', num, err);
      }
    }
  }

  function zoomIn() {
    if (currentScale < 2.5) {
      currentScale += 0.2;
      renderComicView();
    }
  }

  function zoomOut() {
    if (currentScale > 0.6) {
      currentScale -= 0.2;
      renderComicView();
    }
  }

  function resetZoom() {
    currentScale = 1.15;
    renderComicView();
  }

  if (window.pdfjsLib) {
    pdfjsLib.getDocument('../skema-foto-terbaru.pdf').promise.then(pdf => {
      pdfDoc = pdf;
      renderComicView();
    }).catch(err => {
      console.warn('PDF.js failed, using embed fallback:', err);
      container.classList.add('hidden');
      fallbackBox.classList.remove('hidden');
    });
  } else {
    container.classList.add('hidden');
    fallbackBox.classList.remove('hidden');
  }
</script>
