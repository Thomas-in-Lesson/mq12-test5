<script>
  let pdfDoc = null;
  let currentScale = 1.15;
  const container = document.getElementById('comic-reader-container');
  const zoomBadge = document.getElementById('zoom-level-badge');
  const statusMsg = document.getElementById('pdf-status-msg');
  const fallbackBox = document.getElementById('pdf-fallback-container');

  if (window['pdfjs-dist/build/pdf']) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  async function renderComicView() {
    if (!pdfDoc) return;
    zoomBadge.innerText = Math.round(currentScale * 100) + '%';
    container.innerHTML = '';

    for (let num = 1; num <= pdfDoc.numPages; num++) {
      try {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: currentScale });

        const card = document.createElement('div');
        card.className = 'w-full pdf-canvas-card rounded-xl overflow-hidden bg-white mb-4 relative transition-all duration-150 flex flex-col items-center';

        const pageBadge = document.createElement('div');
        pageBadge.className = 'absolute top-2 right-2 z-10 px-2.5 py-1 rounded-full bg-black/70 text-gold text-[10px] font-bold border border-gold/30 pointer-events-none';
        pageBadge.innerText = 'Halaman ' + num + ' / ' + pdfDoc.numPages;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.maxWidth = '100%';
        canvas.style.height = 'auto';

        card.appendChild(pageBadge);
        card.appendChild(canvas);
        container.appendChild(card);

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;
      } catch (err) {
        console.error('Error rendering PDF page', num, err);
      }
    }
  }

  function zoomIn() {
    if (currentScale < 3.0) {
      currentScale += 0.25;
      renderComicView();
    }
  }

  function zoomOut() {
    if (currentScale > 0.5) {
      currentScale -= 0.25;
      renderComicView();
    }
  }

  function resetZoom() {
    currentScale = 1.15;
    renderComicView();
  }

  // 2-Finger Mobile Pinch-To-Zoom Touch Event Handler
  let initialPinchDist = 0;
  let initialScale = currentScale;

  container.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialPinchDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      initialScale = currentScale;
    }
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialPinchDist > 0) {
      const currentDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      const factor = currentDist / initialPinchDist;
      const newScale = Math.min(Math.max(initialScale * factor, 0.5), 3.0);
      if (Math.abs(newScale - currentScale) > 0.08) {
        currentScale = newScale;
        zoomBadge.innerText = Math.round(currentScale * 100) + '%';
      }
    }
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    if (e.touches.length < 2 && initialPinchDist > 0) {
      initialPinchDist = 0;
      renderComicView();
    }
  }, { passive: true });

  if (window.pdfjsLib) {
    pdfjsLib.getDocument('../skema-foto-terbaru.pdf').promise.then(pdf => {
      pdfDoc = pdf;
      renderComicView();
    }).catch(err => {
      console.warn('PDF.js failed, using embed fallback:', err);
      container.classList.add('hidden');
      fallbackBox.classList.remove('hidden');
    });
  } else {
    container.classList.add('hidden');
    fallbackBox.classList.remove('hidden');
  }
</script>
