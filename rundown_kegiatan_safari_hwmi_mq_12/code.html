  let sesiAktif = 'sesi1';

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function barisAgenda(a) {
    const tag = (kelas, isi) => isi ? `<span class="agenda-tag ${kelas}">${esc(isi)}</span>` : '';
    return `
      <div class="agenda-row">
        <div class="agenda-jam">${esc(a.jam)}${a.durasi ? `<span class="durasi">${esc(a.durasi)}</span>` : ''}</div>
        <div>
          <div class="agenda-nama">${esc(a.agenda)}</div>
          ${a.kegiatan ? `<div class="agenda-ket">${esc(a.kegiatan)}</div>` : ''}
          ${a.catatan ? `<div class="agenda-ket">${esc(a.catatan)}</div>` : ''}
          ${tag('tag-daerah', a.daerah)}${tag('tag-seragam', a.seragam)}
          ${window.DenahViewer ? DenahViewer.tautanUntuk(sesiAktif, a.agenda) : ''}
        </div>
      </div>`;
  }

  function kartuHari(hari, index) {
    const judul = hari.label || 'Susunan Acara';
    return `
      <div class="hari-card${index === 0 ? '' : ' tertutup'}">
        <button class="hari-head" type="button" onclick="this.parentNode.classList.toggle('tertutup')">
          <span>
            ${esc(judul)}
            ${hari.tanggal ? `<span class="tgl">${esc(hari.tanggal)}</span>` : ''}
          </span>
          <svg class="karet" width="18" height="18" viewBox="0 0 24 24" fill="#E0B863" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="hari-body">${hari.agenda.map(barisAgenda).join('')}</div>
      </div>`;
  }

  function pilihSesi(kunci) {
    sesiAktif = kunci;
    ['sesi1', 'sesi2', 'sesi3'].forEach((k) => {
      const btn = document.getElementById('btn-' + k);
      if (btn) btn.classList.toggle('is-active', k === kunci);
    });

    const sesi = rundownData[kunci];
    const meta = document.getElementById('sesi-meta');
    const daftar = document.getElementById('rundown-list');

    if (!sesi || !sesi.hari.length) {
      meta.innerHTML = '';
      daftar.innerHTML = `
        <div class="hari-card" style="padding:28px;text-align:center">
          <h3 style="margin:0 0 6px;font-size:15px;font-weight:700;color:rgb(var(--c-gold))">Rundown Sesi Ini Segera Hadir</h3>
          <p style="margin:0;font-size:12px;color:rgb(var(--c-on-surface-variant))">Susunan acara belum tersedia dari tim panitia.</p>
        </div>`;
      return;
    }

    const jumlah = sesi.hari.reduce((n, h) => n + h.agenda.length, 0);
    meta.innerHTML = [
      sesi.armada ? `Armada: ${sesi.armada}` : '',
      `${sesi.hari.length} hari`,
      `${jumlah} agenda`,
    ].filter(Boolean).map((t) => `<span class="meta-chip">${esc(t)}</span>`).join('');

    daftar.innerHTML = sesi.hari.map(kartuHari).join('');
  }

  pilihSesi('sesi1');
