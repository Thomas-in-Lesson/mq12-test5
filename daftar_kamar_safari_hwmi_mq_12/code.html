  let activeHotelKey = 'Semarang';

  const hotelTabsContainer = document.getElementById('hotel-tabs');
  const activeHotelName = document.getElementById('active-hotel-name');
  const activeRoomCount = document.getElementById('active-room-count');
  const roomGrid = document.getElementById('room-grid');
  const searchInput = document.getElementById('room-search');

  function renderTabs() {
    hotelTabsContainer.innerHTML = '';
    Object.keys(hotelsData).forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const isActive = key === activeHotelKey;
      btn.className = `px-4 py-2 rounded-full text-xs font-bold transition-all duration-200 border ${
        isActive 
          ? 'bg-secondary text-surface-container-lowest border-secondary shadow-md scale-105' 
          : 'bg-surface-container text-on-surface-variant border-outline-variant/30 hover:border-secondary/50'
      }`;
      btn.innerHTML = `<span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">location_city</span>${key}</span>`;
      btn.addEventListener('click', () => {
        activeHotelKey = key;
        searchInput.value = '';
        renderTabs();
        renderRooms();
      });
      hotelTabsContainer.appendChild(btn);
    });
  }

  function renderRooms(query = '') {
    roomGrid.innerHTML = '';
    const q = query.toLowerCase().trim();
    let totalDisplayed = 0;

    if (q !== '') {
      // Search across ALL hotels if query exists
      activeHotelName.innerHTML = `<span class="material-symbols-outlined">search</span> Hasil Pencarian: "${query}"`;
      Object.keys(hotelsData).forEach(hKey => {
        const hotel = hotelsData[hKey];
        hotel.rooms.forEach(room => {
          const matchRoom = room.roomNo.toLowerCase().includes(q) || room.type.toLowerCase().includes(q);
          const matchOccupants = room.occupants.some(name => name.toLowerCase().includes(q));
          if (matchRoom || matchOccupants) {
            totalDisplayed++;
            roomGrid.appendChild(createRoomCard(room, hotel.name));
          }
        });
      });
      activeRoomCount.textContent = `${totalDisplayed} Kamar Ditemukan`;
    } else {
      // Display active hotel rooms
      const hotel = hotelsData[activeHotelKey];
      activeHotelName.innerHTML = `<span class="material-symbols-outlined">hotel</span> ${hotel.name}`;
      hotel.rooms.forEach(room => {
        totalDisplayed++;
        roomGrid.appendChild(createRoomCard(room, hotel.name));
      });
      activeRoomCount.textContent = `${totalDisplayed} Kamar`;
    }

    if (totalDisplayed === 0) {
      roomGrid.innerHTML = `<div class="col-span-full text-center py-12 text-on-surface-variant space-y-2">
        <span class="material-symbols-outlined text-[48px] opacity-40">search_off</span>
        <p class="font-medium">Tidak ada kamar atau nama peserta yang cocok dengan "${query}"</p>
      </div>`;
    }
  }

  function createRoomCard(room, hotelName) {
    const card = document.createElement('div');
    card.className = 'room-card bg-surface-container-low rounded-xl p-5 border-t border-l border-surface-variant/30 shadow-md space-y-3 hover:bg-surface-container transition-colors';
    
    const occupantsList = room.occupants.map(name => 
      `<li class="flex items-start gap-2.5 text-sm text-on-surface-variant">
        <span class="w-2 h-2 rounded-full bg-primary mt-1.5 shrink-0"></span>
        <span class="font-medium text-on-surface">${name}</span>
      </li>`
    ).join('');

    card.innerHTML = `
      <div class="flex items-center justify-between border-b border-surface-variant/40 pb-2.5">
        <div class="space-y-0.5">
          <span class="text-[10px] uppercase font-bold tracking-wider text-secondary/80">${hotelName}</span>
          <h4 class="font-title-lg text-title-lg font-bold text-secondary flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[20px]">door_front</span> ${room.roomNo}
          </h4>
        </div>
        <span class="text-[11px] px-2.5 py-1 rounded-full bg-secondary/15 text-secondary font-semibold border border-secondary/30">
          ${room.type} (${room.occupants.length} Pax)
        </span>
      </div>
      <ul class="space-y-2 pt-1">
        ${occupantsList}
      </ul>
    `;
    return card;
  }

  searchInput.addEventListener('input', (e) => {
    renderRooms(e.target.value);
  });

  renderTabs();
  renderRooms();
</script>
<script src="../site-navigation.js"></script></body></html>
