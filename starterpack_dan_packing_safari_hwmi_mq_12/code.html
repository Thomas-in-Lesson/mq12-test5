  const btnPutri = document.getElementById('btn-putri');
  const contentContainer = document.getElementById('content-container');

  function updateTabsUI() {
    const activeClass = 'px-5 py-2 rounded-full text-xs font-bold border transition-all duration-200 bg-secondary text-surface-container-lowest border-secondary shadow-md flex items-center gap-1.5';

    btnSesi2.className = activeSesi === 'sesi2' ? activeClass : inactiveClass;
    btnSesi3.className = activeSesi === 'sesi3' ? activeClass : inactiveClass;

    const genderActiveClass = 'px-6 py-2 rounded-full text-xs font-bold border transition-all duration-200 bg-primary/20 text-primary border-primary/40 shadow-sm flex items-center gap-1.5';
    const genderInactiveClass = 'px-6 py-2 rounded-full text-xs font-bold border transition-all duration-200 bg-surface-container text-on-surface-variant border-outline-variant/30 hover:border-secondary/50 flex items-center gap-1.5';

    btnPutra.className = activeGender === 'putra' ? genderActiveClass : genderInactiveClass;
    btnPutri.className = activeGender === 'putri' ? genderActiveClass : genderInactiveClass;
  }

  function renderContent() {
    updateTabsUI();
    const cur = sesiData[activeSesi][activeGender];
    
    const itemListHTML = cur.items.map((item) => `
      <div class="flex items-start gap-3 p-3.5 rounded-xl bg-surface-container/80 border border-outline-variant/20 shadow-sm">
        <span class="w-2.5 h-2.5 rounded-full bg-secondary shrink-0 mt-1.5"></span>

          <span>${item.text}</span>
          ${item.panitia ? '<span class="inline-block ml-2 px-2 py-0.5 rounded text-[11px] font-bold bg-primary/20 text-primary border border-primary/30">Disediakan Panitia</span>' : ''}
        </div>
      </div>
    `).join('');

    const selempangHTML = cur.packing.selempang.map(s => 
      `<li class="flex items-start gap-2.5 text-sm text-on-surface-variant"><span class="w-2 h-2 rounded-full bg-secondary mt-1.5 shrink-0"></span><span>${s}</span></li>`
    ).join('');

    const ranselHTML = cur.packing.ransel.map(r => 
      `<li class="flex items-start gap-2.5 text-sm text-on-surface-variant"><span class="w-2 h-2 rounded-full bg-primary mt-1.5 shrink-0"></span><span>${r}</span></li>`
    ).join('');

      <!-- Starterpack Section -->
      <section class="bg-surface-container-low rounded-xl p-5 md:p-6 border-t border-l border-surface-variant/30 shadow-md space-y-4">
        <div class="border-b border-surface-variant/40 pb-3 flex items-center justify-between">

        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${itemListHTML}
        </div>
      </section>

      <!-- Teknis Packing Section -->
      <section class="bg-surface-container-low rounded-xl p-5 md:p-6 border-t border-l border-surface-variant/30 shadow-md space-y-6">
        <div class="border-b border-surface-variant/40 pb-3">
          <h2 class="font-headline-md-mobile text-headline-md-mobile text-secondary flex items-center gap-2">
            <span class="material-symbols-outlined">backpack</span> TEKNIS PACKING TAS — ${activeSesi.toUpperCase()} (${activeGender.toUpperCase()})
          </h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Tas Selempang -->
          <div class="p-5 rounded-xl bg-surface-container border border-secondary/30 space-y-3">
            <div class="flex items-center gap-2 text-secondary border-b border-surface-variant/50 pb-2">
              <span class="material-symbols-outlined text-[24px]">work</span>
              <h3 class="font-title-lg font-bold">1. Tas Selempang (Ziarah & Lokasi)</h3>
            </div>
            <p class="text-xs text-on-surface-variant italic">Dibawa saat ziarah / mengunjungi lokasi tujuan acara.</p>
            <ul class="space-y-2.5 pt-1">
              ${selempangHTML}
            </ul>
          </div>

          <!-- Tas Ransel -->
          <div class="p-5 rounded-xl bg-surface-container border border-primary/30 space-y-3">
            <div class="flex items-center gap-2 text-primary border-b border-surface-variant/50 pb-2">

              <h3 class="font-title-lg font-bold">2. Tas Ransel & Koper (${activeSesi.toUpperCase()})</h3>

            <ul class="space-y-2.5 pt-1">

        </div>

    `;
